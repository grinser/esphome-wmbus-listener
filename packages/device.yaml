# Board, Wi-Fi, Home Assistant API, OTA updates and the clock.
# Settings: substitutions in wmbus.yaml (start values for the ones Home
# Assistant can change, see the settings at the end of each package).

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  platformio_options:
    upload_speed: 921600
  includes:
    - power_off.h
    - loadchart.h
    - settings.h
    - status.h
  on_boot:
    # Must run before components set up their pins: release the deep-sleep hold
    # on the radio reset pin (GPIO12) from a previous "power off", or the radio
    # cannot start.
    - priority: 900
      then:
        - lambda: wmbus_release_held_pins();
    # Wi-Fi power saving from the Home Assistant setting. It takes effect when
    # Wi-Fi connects, so set it before Wi-Fi starts (setup priority 250).
    - priority: 700
      then:
        - lambda: |-
            auto opt = id(wifi_power_save_sel).current_option();
            if (opt == std::string("NONE"))
              wifi::global_wifi_component->set_power_save_mode(wifi::WIFI_POWER_SAVE_NONE);
            else if (opt == std::string("LIGHT"))
              wifi::global_wifi_component->set_power_save_mode(wifi::WIFI_POWER_SAVE_LIGHT);
            else if (opt == std::string("HIGH"))
              wifi::global_wifi_component->set_power_save_mode(wifi::WIFI_POWER_SAVE_HIGH);
            // anything else: keep power_save_mode from the config
    # Brief LED self-test so you can confirm GPIO35 is wired right at every boot.
    - priority: -100
      then:
        - light.turn_on:
            id: rx_led
            # day/night brightness (boot: HA time not yet valid -> treated as day)
            brightness: !lambda |-
              auto now = id(ha_time).now();
              bool night = now.is_valid() && is_night_hour(now.hour, id(night_start_h).state, id(night_end_h).state);
              return (night ? id(led_night_pct).state : id(led_day_pct).state) / 100.0f;
            flash_length: 400ms
        # Show the display bright once at boot — on the status page, handy for
        # reading the IP — then it settles into the always-on dim main page.
        - display.page.show: page_status
        - script.execute: show_display

esp32:
  # Confirmed valid PlatformIO board id for the V3 (ESP32-S3, 8 MB flash).
  # Fallback if the build complains: board: esp32-s3-devkitc-1 (keep flash_size + pin map).
  board: heltec_wifi_lora_32_V3
  flash_size: 8MB
  # ESPHome defaults to the S3 maximum (240 MHz) since 2026.04. 80 MHz is the
  # documented floor with Wi-Fi active and saves ~20-30 mA; decoding one short
  # telegram every ~5 s is a trivial workload at this speed.
  cpu_frequency: 80MHz
  framework:
    type: esp-idf

logger:
  # At least DEBUG is compiled in so the "Log level" setting can switch to it
  # without a new install; log_level is the level after every boot.
  level: ${ (log_level | upper) if (log_level | upper) in ['VERBOSE', 'VERY_VERBOSE'] else 'DEBUG' }
  initial_level: ${ log_level | upper }   # raw telegrams are logged at DEBUG, invisible at INFO
  baud_rate: 115200
  hardware_uart: UART0  # Heltec V3: route console to UART0 (CP2102/USB-C). Default on ESP32-S3 is
                        # USB_SERIAL_JTAG, which is not wired to the V3's USB-C port — logs go silent.
  logs:
    # The meter component prints the AES key in plain text in its config dump
    # (CONFIG level). Capped at INFO, the key never reaches a log, also not at
    # "Log level" DEBUG. Its warnings and errors still show.
    wmbus_meter: INFO
    # At DEBUG the decoder logs the decrypted readings. Capped like the key,
    # so switching "Log level" in Home Assistant does not put them in the log.
    wmbusmeters: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # OTA and logs reach the board by its mDNS name (<name>.local, ESPHome's default),
  # so a new DHCP address does not matter. Deliberately no use_address: it would
  # pin "wmbus.local" and break boards whose name has a MAC suffix (web installer).
  # Also no manual_ip — on many consumer mesh routers a device-side static IP fights
  # DHCP and can lock out OTA. For a fixed address, add a DHCP reservation instead.
  # DTIM modem sleep — the biggest Wi-Fi saving (~10-30 mA avg). Trade-off: the HA
  # API can lag by seconds. If you see disconnects or it feels too sluggish, fall
  # back to LIGHT (the ESP32 default).
  power_save_mode: ${ wifi_power_save | upper }
  # TX power, default is 20.5dB. 11 dB is plenty for an access point nearby — raise
  # it if the "WiFi Signal" sensor drops much below ~-75 dBm or the link gets flaky.
  output_power: ${wifi_output_power}

api:
  encryption:
    key: !secret api_key
  # No restart while Home Assistant is away (the default restarts after 15 min
  # without a client). A restart would lose the clock until HA is back: no load
  # chart, no night mode. Telegrams keep being decoded either way.
  reboot_timeout: 0s

ota:
  - platform: esphome
    id: ota_esphome   # wmbus.factory.yaml extends it
    # Encrypted uploads with the api key (bare block inherits it). Replaces the
    # old password, whose plaintext fallback ESPHome removes in 2027.3.
    encryption: {}

# web_server disabled to save power (fewer wakeups, less RAM). Re-enable for
# bring-up/debugging if needed — logs are also available via `esphome logs` (OTA).
# web_server:
#   version: 3

time:
  - platform: homeassistant
    id: ha_time   # also drives the night mode of the display and the LED

# IP/SSID for the status page (and exposed to HA).
text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip_text
      name: "IP Address"
    ssid:
      id: wifi_ssid_text
      name: "SSID"

sensor:
  - platform: wifi_signal       # drives the "WiFi: NN dBm" line on the status page
    id: wifi_signal_db
    name: "WiFi Signal"
    update_interval: 10s
    entity_category: diagnostic

# --- Settings in Home Assistant ------------------------------------------------
# Rarely needed, so hidden until you enable them on the device page.
select:
  - platform: template
    name: "WiFi power save"
    id: wifi_power_save_sel
    icon: mdi:wifi-cog
    entity_category: config
    disabled_by_default: true
    options: ["NONE", "LIGHT", "HIGH"]
    initial_option: ${ wifi_power_save | upper }
    optimistic: true
    restore_value: true          # applied at the next restart

  - platform: template
    name: "Log level"
    icon: mdi:math-log
    entity_category: config
    disabled_by_default: true
    options: ["NONE", "ERROR", "WARN", "INFO", "DEBUG", "VERBOSE", "VERY_VERBOSE"]
    initial_option: ${ log_level | upper }  # back to log_level after every restart
    optimistic: true
    restore_value: false
    on_value:
      - lambda: |-
          uint8_t level = ESPHOME_LOG_LEVEL_INFO;
          if (x == "NONE") level = ESPHOME_LOG_LEVEL_NONE;
          else if (x == "ERROR") level = ESPHOME_LOG_LEVEL_ERROR;
          else if (x == "WARN") level = ESPHOME_LOG_LEVEL_WARN;
          else if (x == "DEBUG") level = ESPHOME_LOG_LEVEL_DEBUG;
          else if (x == "VERBOSE") level = ESPHOME_LOG_LEVEL_VERBOSE;
          else if (x == "VERY_VERBOSE") level = ESPHOME_LOG_LEVEL_VERY_VERBOSE;
          // Above the compiled level the logger keeps its compiled maximum.
          logger::global_logger->set_log_level(level);

button:
  - platform: restart
    name: "Restart"
    entity_category: config

  - platform: factory_reset      # clears Wi-Fi set over USB, the meter
    name: "Factory reset"        # setup and every setting stored on the board
    entity_category: config
    disabled_by_default: true
